<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fig;src:url(file:///home/user/Code-art/letra/Figtree-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Fig;src:url(file:///home/user/Code-art/letra/Figtree-Bold.ttf);font-weight:700}
@font-face{font-family:Fig;src:url(file:///home/user/Code-art/letra/Figtree-Medium.ttf);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:Fig,sans-serif;color:#fff}
#bg{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(160px);opacity:.42}
#cam{position:absolute;inset:0;perspective:1500px}
.sc{position:absolute;inset:0;display:none;align-items:center;justify-content:center;transform-style:preserve-3d}
.in{transform-style:preserve-3d}
.w{display:inline-block;white-space:pre}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
.kin{text-align:center;font-weight:800;line-height:1.02;letter-spacing:-4px;width:1000px}
.kin .w{text-shadow:0 0 60px rgba(255,40,40,.85),0 0 160px rgba(40,70,255,.6)}
.card{width:880px;border-radius:64px;padding:64px 70px 84px;position:relative;overflow:hidden}
.card.red{background:linear-gradient(135deg,#ff3b30 0%,#d1001c 55%,#7a0016 100%);box-shadow:0 60px 140px rgba(230,0,30,.5),0 0 0 3px rgba(80,110,255,.35),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -20px 60px rgba(60,0,20,.4)}
.card.blue{background:linear-gradient(135deg,#4d6dff 0%,#1f36e0 55%,#0b1680 100%);box-shadow:0 60px 140px rgba(30,60,255,.5),0 0 0 3px rgba(255,60,60,.3),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -20px 60px rgba(0,0,60,.4)}
.card .lbl{font-weight:700;font-size:38px;opacity:.75;margin-bottom:24px}
.card .ln{font-weight:800;line-height:1.04;letter-spacing:-4px}
.sh{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.42) 45%,transparent 60%);mix-blend-mode:screen}
.chat{width:920px;display:flex;flex-direction:column;align-items:flex-end;gap:34px}
.chat.left{align-items:flex-start}
.bub{font-weight:800;font-size:100px;line-height:1.05;padding:38px 62px 44px;border-radius:70px;position:relative;max-width:920px;
 background:linear-gradient(160deg,#ff4a3d,#cc0f1f);box-shadow:0 30px 90px rgba(255,30,40,.45),inset 0 3px 0 rgba(255,255,255,.5);transform-origin:100% 100%}
.bub:after{content:"";position:absolute;bottom:0;right:-14px;width:46px;height:46px;background:#cc0f1f;border-bottom-left-radius:40px;clip-path:polygon(0 0,100% 100%,0 100%)}
.left .bub{background:linear-gradient(160deg,#2a3a8a,#121a4a);box-shadow:0 30px 80px rgba(20,40,200,.4),inset 0 2px 0 rgba(255,255,255,.2);transform-origin:0 100%}
.left .bub:after{right:auto;left:-14px;background:#121a4a;border-bottom-left-radius:0;border-bottom-right-radius:40px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.visto{font-weight:700;font-size:40px;color:#cfc4dd}
#moon{position:absolute;width:640px;height:640px;border-radius:50%;
 background:radial-gradient(circle at 38% 34%,#fff 0%,#e8eeff 30%,#9fb4ff 62%,#3a55e0 100%);box-shadow:0 0 120px 30px rgba(120,150,255,.65),0 0 340px 120px rgba(30,60,255,.45)}
.crat{position:absolute;border-radius:50%;background:rgba(60,80,190,.22);box-shadow:inset 6px 8px 14px rgba(20,30,120,.3)}
#luna{position:absolute;font-weight:800;font-size:250px;color:#fff;text-shadow:0 10px 60px rgba(200,0,20,.8)}
#player{width:900px;border-radius:72px;padding:56px;background:rgba(10,14,40,.62);backdrop-filter:blur(40px);border:2px solid rgba(255,255,255,.14);box-shadow:0 80px 160px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.18)}
#cover{width:788px;height:788px;border-radius:44px;background:url(portada.png) center/cover}
#ttl{font-weight:800;font-size:62px;margin-top:40px}
#art{font-weight:500;font-size:40px;opacity:.6;margin-top:4px}
#bar{height:12px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:40px;position:relative}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#fff}
#knob{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
#ctr{display:flex;justify-content:center;align-items:center;gap:110px;margin-top:40px}
#ctr svg{fill:#fff}
#plyr{position:absolute;left:90px;right:90px;top:190px;font-weight:800;font-size:96px;line-height:1.08;letter-spacing:-2px}
</style></head><body>
<div id="bg">
 <div class="blob" id="b1" style="width:900px;height:900px;background:#e3101c"></div>
 <div class="blob" id="b2" style="width:800px;height:800px;background:#1638ff"></div>
 <div class="blob" id="b3" style="width:700px;height:700px;background:#b0001a"></div>
</div>
<div id="cam"></div>
<div id="vig"></div>
<script>
const W=__WORDS__;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const txt=i=>W[i][0].replace(/\.$/,''), st=i=>W[i][1];
const rng=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const spans=ids=>ids.map(i=>`<span class="w" data-i="${i}">${txt(i)}</span>`).join(' ');
// escenas: tipo, entra, sale, opciones; cámara [rx0,rx1,ry0,ry1,rz0,rz1]
const S=[
 {k:'kin',a:36.9,b:38.6,lines:[[12],[13]],fs:240,cam:[0,0,-6,6,0,0]},
 {k:'card',c:'red',a:38.6,b:41.5,ids:rng(14,19),fs:140,cam:[14,6,-24,8,-4,1]},
 {k:'chat',a:41.5,b:45.9,bubs:[rng(20,21),rng(22,26)],visto:45.3,cam:[6,2,12,-10,0,0]},
 {k:'kin',a:45.9,b:49.3,lines:[rng(27,30),rng(31,33)],fs:132,cam:[0,0,8,-8,0,0]},
 {k:'card',c:'blue',a:49.3,b:54.3,ids:rng(34,44),fs:112,cam:[12,4,26,-12,4,-2]},
 {k:'kin',a:54.3,b:55.55,lines:[[45]],fs:280,cam:[0,0,0,0,0,0]},
 {k:'card',c:'red',a:55.55,b:56.75,ids:rng(46,48),fs:160,cam:[14,8,-22,-4,-4,-1]},
 {k:'chat',a:56.75,b:58.94,bubs:[rng(49,51),rng(52,55)],visto:58.55,cam:[6,2,10,-6,0,0]},
 {k:'luna',a:58.94,b:60.06,word:56},
 {k:'player',a:60.06,b:63.42,ids:rng(57,64)},
 {k:'chat',left:1,a:63.42,b:68.0,bubs:[rng(65,68),rng(69,73)],cam:[6,2,-14,10,0,0]},
 {k:'kin',a:68.0,b:73.2,lines:[rng(74,77),rng(78,82)],fs:118,cam:[4,0,-8,8,0,0]},
];
// montar
S.forEach((s,n)=>{const d=document.createElement('div');d.className='sc';d.id='s'+n;let h='';
 if(s.k==='kin')h=`<div class="in kin" style="font-size:${s.fs}px">${s.lines.map(l=>spans(l)).join('<br>')}</div>`;
 if(s.k==='card')h=`<div class="in card ${s.c}"><div class="lbl">Letra</div><div class="ln" style="font-size:${s.fs}px">${spans(s.ids)}</div><div class="sh"></div></div>`;
 if(s.k==='chat')h=`<div class="in chat ${s.left?'left':''}">${s.bubs.map(b=>`<div class="bub">${spans(b)}</div>`).join('')}${s.visto?'<div class="visto">Visto</div>':''}</div>`;
 if(s.k==='luna'){h=`<div id="moon"></div><div id="luna">LUNA</div>`}
 if(s.k==='player')h=`<div class="in" style="align-self:flex-start;margin-top:470px"><div id="player"><div id="cover"></div><div id="ttl">Vuelve</div><div id="art">Anuel AA</div><div id="bar"><div id="fill"></div><div id="knob"></div></div>
  <div id="ctr"><svg width="90" height="70" viewBox="0 0 90 70"><path d="M44 5 L4 35 L44 65Z M88 5 L48 35 L88 65Z"/></svg><svg width="110" height="110" viewBox="0 0 110 110"><rect x="25" y="15" width="20" height="80" rx="6"/><rect x="65" y="15" width="20" height="80" rx="6"/></svg><svg width="90" height="70" viewBox="0 0 90 70"><path d="M2 5 L42 35 L2 65Z M46 5 L86 35 L46 65Z"/></svg></div></div></div><div id="plyr">${spans(s.ids)}</div>`;
 d.innerHTML=h;$('cam').appendChild(d);s.el=d;s.inn=d.querySelector('.in');s.ws=[...d.querySelectorAll('.w')];s.bubEls=[...d.querySelectorAll('.bub')];s.vEl=d.querySelector('.visto');s.sh=d.querySelector('.sh')});
[[120,140,90],[380,90,60],[300,330,120],[110,400,70],[460,420,80],[220,520,50]].forEach(([x,y,r])=>{const c=document.createElement('div');c.className='crat';Object.assign(c.style,{left:x+'px',top:y+'px',width:r+'px',height:r+'px'});$('moon').appendChild(c)});
function pop(el,t,a){const p=lin(t,a-0.05,a+0.17);el.style.opacity=cl(p*3);el.style.transform=`translateY(${(1-eo(p))*40}px) scale(${0.6+0.4*back(p)})`;el.style.filter=`blur(${(1-p)*12}px)`}
function dim(el,t,a){const p=lin(t,a-0.05,a+0.12);el.style.color=`rgba(255,255,255,${0.3+0.7*p})`;el.style.textShadow=p>0?`0 0 ${30*p}px rgba(255,40,40,${0.85*p})`:'none'}
window.render=function(t){
 const bb=(id,x,y,s)=>{$(id).style.transform=`translate(${x}px,${y}px) scale(${s})`};
 bb('b1',-250+Math.sin(t*.7)*120,-150+Math.cos(t*.5)*160,1);bb('b2',500+Math.cos(t*.6)*140,1100+Math.sin(t*.8)*120,1);bb('b3',300+Math.sin(t*.9+1)*200,600+Math.cos(t*.4)*200,1);
 let pulse=0;for(const w of W){const d=t-w[1];if(d>=0&&d<0.4)pulse=Math.max(pulse,Math.pow(1-d/0.4,3))}
 $('bg').style.opacity=0.8+0.2*pulse;
 for(const s of S){const on=t>=s.a-0.02&&t<s.b+0.04;s.el.style.display=on?'flex':'none';if(!on)continue;
  const i=eo(lin(t,s.a-0.02,s.a+0.22)),o=lin(t,s.b-0.12,s.b+0.04);s.el.style.opacity=Math.min(i,1-o);
  s.el.style.filter=`blur(${(1-i)*18+o*26}px)`;const sc=(0.86+0.14*i)*(1+0.5*o*o*o);
  const p=eio(lin(t,s.a,s.b)),c=s.cam||[0,0,0,0,0,0];
  if(s.inn)s.inn.style.transform=`scale(${sc}) rotateX(${c[0]+(c[1]-c[0])*p}deg) rotateY(${c[2]+(c[3]-c[2])*p}deg) rotateZ(${c[4]+(c[5]-c[4])*p}deg)`;
  if(s.k==='kin'||s.k==='card')s.ws.forEach(w=>pop(w,t,st(+w.dataset.i)));
  if(s.k==='kin'&&s.inn)s.inn.style.transform+=` translateZ(${(t-s.a)*50}px)`;
  if(s.sh)s.sh.style.transform=`translateX(${-1000+lin(t,s.a+0.1,s.a+1.2)*2000}px)`;
  if(s.k==='chat'){s.bubEls.forEach(b=>{const a=st(+b.querySelector('.w').dataset.i);const q=lin(t,a-0.1,a+0.12);b.style.opacity=q;b.style.transform=`scale(${0.4+0.6*back(q)})`});
   s.ws.forEach(w=>dim(w,t,st(+w.dataset.i)));if(s.vEl){const v=lin(t,s.visto,s.visto+0.2);s.vEl.style.opacity=v;s.vEl.style.transform=`translateY(${(1-v)*20}px)`}}
  if(s.k==='luna'){const c4=lin(t,s.a,s.b),pm=eo(lin(t,s.a,s.a+0.56));$('moon').style.transform=`translateY(${(1-pm)*700-c4*60}px) scale(${0.7+0.3*pm+c4*0.08})`;
   const pl=lin(t,s.a+0.06,s.a+0.56);$('luna').style.opacity=pl;$('luna').style.letterSpacing=(120-80*eo(pl))+'px';$('luna').style.transform=`scale(${1.3-0.3*eo(pl)+c4*0.05}) translateX(20px)`;s.el.style.transform=`scale(${sc})`}
  if(s.k==='player'){const pp=eo(lin(t,s.a,s.a+0.54)),c5=t-s.a;s.inn.style.transform=`rotateX(${18*(1-pp)+Math.sin(c5*1.2)*3}deg) rotateY(${-14*(1-pp)+Math.sin(c5*.8)*5}deg) translateY(${(1-pp)*300}px)`;
   const pr=t/289.9;$('fill').style.width=pr*100+'%';$('knob').style.left=pr*100+'%';$('cover').style.transform=`scale(${1+0.02*pulse})`;
   const ly=lin(t,s.a-0.06,s.a+0.3);$('plyr').style.opacity=ly;$('plyr').style.transform=`translateY(${(1-eo(ly))*60}px)`;s.ws.forEach(w=>dim(w,t,st(+w.dataset.i)))}
 }
 $('cam').style.opacity=1-lin(t,72.7,73.2);
};
</script></body></html>
